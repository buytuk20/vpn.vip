<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.T.C VPN - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { font-family: 'Cairo', sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .gold-text { color: #FFD700; }
        .gold-bg { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); }
        .btn-gold { 
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); 
            color: #000; 
            transition: all 0.3s; 
        }
        .btn-gold:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3); 
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="glass rounded-2xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 rounded-full gold-bg flex items-center justify-center text-4xl">🔐</div>
                <h1 class="text-4xl font-black gold-text">B.T.C VPN</h1>
                <p class="text-gray-400 mt-2">لوحة التحكم الاحترافية</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">اسم المستخدم</label>
                    <input id="username" type="text" placeholder="أدخل اسم المستخدم" 
                           class="w-full p-3 bg-gray-800/50 border border-gray-700 rounded-lg text-white focus:border-yellow-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">كلمة المرور</label>
                    <input id="password" type="password" placeholder="أدخل كلمة المرور" 
                           class="w-full p-3 bg-gray-800/50 border border-gray-700 rounded-lg text-white focus:border-yellow-500 focus:outline-none">
                </div>
                <button onclick="doLogin()" id="loginBtn" class="w-full btn-gold p-3 rounded-lg font-bold text-lg">
                    تسجيل الدخول
                </button>
            </div>
            
            <div id="errorMsg" class="mt-4 p-3 bg-red-500/20 border border-red-500 rounded-lg text-red-400 text-center hidden"></div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard" class="hidden min-h-screen">
        <!-- الشريط العلوي -->
        <nav class="glass border-b border-gray-700 sticky top-0 z-50">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full gold-bg flex items-center justify-center text-xl">🔐</div>
                    <div>
                        <h1 class="text-2xl font-black gold-text">B.T.C VPN</h1>
                        <p id="userRole" class="text-xs text-gray-400"></p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-left">
                        <p id="userName" class="text-sm text-gray-400"></p>
                        <p id="userCredits" class="text-lg font-bold gold-text"></p>
                    </div>
                    <button onclick="doLogout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg transition text-sm">
                        🚪 خروج
                    </button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-6 py-8">
            <!-- الإحصائيات -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="glass rounded-xl p-6">
                    <p class="text-gray-400 text-sm">الرصيد المتاح</p>
                    <p id="statCredits" class="text-3xl font-black gold-text mt-2">0</p>
                </div>
                <div class="glass rounded-xl p-6">
                    <p class="text-gray-400 text-sm">إجمالي الحسابات</p>
                    <p id="statTotal" class="text-3xl font-black text-blue-400 mt-2">0</p>
                </div>
                <div class="glass rounded-xl p-6">
                    <p class="text-gray-400 text-sm">الحسابات النشطة</p>
                    <p id="statActive" class="text-3xl font-black text-green-400 mt-2">0</p>
                </div>
                <div class="glass rounded-xl p-6">
                    <p class="text-gray-400 text-sm">المنتهية</p>
                    <p id="statExpired" class="text-3xl font-black text-red-400 mt-2">0</p>
                </div>
            </div>

            <!-- إنشاء حساب جديد -->
            <div class="glass rounded-xl p-6 mb-8">
                <h2 class="text-2xl font-bold gold-text mb-6"> إنشاء حساب جديد</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">اسم المستخدم</label>
                        <input id="accUsername" type="text" placeholder="اتركه فارغاً للتوليد العشوائي" 
                               class="w-full p-3 bg-gray-800/50 border border-gray-700 rounded-lg text-white focus:border-yellow-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">كلمة المرور</label>
                        <input id="accPassword" type="text" placeholder="اتركها فارغة للتوليد العشوائي" 
                               class="w-full p-3 bg-gray-800/50 border border-gray-700 rounded-lg text-white focus:border-yellow-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">الباقة</label>
                        <select id="accType" class="w-full p-3 bg-gray-800/50 border border-gray-700 rounded-lg text-white focus:border-yellow-500 focus:outline-none">
                            <option value="1">🎁 تجريبي - يوم واحد</option>
                            <option value="2">📅 أسبوعي - 7 أيام</option>
                            <option value="3">📆 شهري - 30 يوم</option>
                            <option value="4">️ 3 أشهر - 90 يوم</option>
                            <option value="5"> جيمنج أسبوعي</option>
                            <option value="6">🎮 جيمنج شهري</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex items-center gap-4 mb-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input id="isRandom" type="checkbox" checked class="w-5 h-5 accent-yellow-500">
                        <span class="text-gray-300">توليد عشوائي</span>
                    </label>
                </div>
                
                <button onclick="createAccount()" id="createBtn" class="btn-gold px-8 py-3 rounded-lg font-bold text-lg">
                    إنشاء الحساب
                </button>
                
                <!-- نتيجة الإنشاء -->
                <div id="createResult" class="mt-6 p-6 bg-green-500/10 border border-green-500 rounded-lg hidden">
                    <p class="font-bold text-green-400 text-xl mb-4">✅ تم إنشاء الحساب بنجاح!</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-gray-800/50 p-4 rounded-lg">
                            <p class="text-gray-400 text-sm">اسم المستخدم</p>
                            <p id="resultUsername" class="font-mono text-xl gold-text"></p>
                        </div>
                        <div class="bg-gray-800/50 p-4 rounded-lg">
                            <p class="text-gray-400 text-sm">كلمة المرور</p>
                            <p id="resultPassword" class="font-mono text-xl text-green-400"></p>
                        </div>
                        <div class="bg-gray-800/50 p-4 rounded-lg">
                            <p class="text-gray-400 text-sm">الباقة</p>
                            <p id="resultPlan" class="font-mono text-xl text-blue-400"></p>
                        </div>
                        <div class="bg-gray-800/50 p-4 rounded-lg">
                            <p class="text-gray-400 text-sm">تاريخ الانتهاء</p>
                            <p id="resultExpiry" class="font-mono text-xl text-purple-400"></p>
                        </div>
                    </div>
                    <button onclick="copyCredentials()" class="mt-4 btn-gold px-6 py-2 rounded-lg font-bold">
                        📋 نسخ البيانات
                    </button>
                </div>
            </div>

            <!-- قائمة الحسابات -->
            <div class="glass rounded-xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold gold-text">📋 الحسابات</h2>
                    <button onclick="loadAccounts()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition">
                        🔄 تحديث
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-right">
                        <thead class="bg-gray-800/50">
                            <tr>
                                <th class="p-4 text-gray-400">المستخدم</th>
                                <th class="p-4 text-gray-400">الباقة</th>
                                <th class="p-4 text-gray-400">الانتهاء</th>
                                <th class="p-4 text-gray-400">الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="accountsList" class="divide-y divide-gray-700"></tbody>
                    </table>
                </div>
                <p id="noAccounts" class="text-center py-8 text-gray-400 hidden">لا توجد حسابات</p>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('btc_token');
        let currentUser = null;
        let lastCreated = null;

        // التحقق عند التحميل
        if (token) verifyToken();

        async function verifyToken() {
            try {
                const res = await fetch('/api/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.data;
                    showDashboard();
                } else {
                    doLogout();
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('errorMsg');

            if (!username || !password) {
                errorEl.textContent = 'يرجى إدخال البيانات';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> جاري...';
            errorEl.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';

                if (data.success && data.data) {
                    token = data.data.token;
                    localStorage.setItem('btc_token', token);
                    currentUser = data.data.user;
                    showDashboard();
                } else {
                    errorEl.textContent = data.message || 'بيانات خاطئة';
                    errorEl.classList.remove('hidden');
                }
            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
                errorEl.textContent = 'خطأ في الاتصال بالخادم';
                errorEl.classList.remove('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userRole').textContent = currentUser.role === 'admin' ? '👑 مدير النظام' : '👤 موزع';
            document.getElementById('userCredits').textContent = ` ${currentUser.credits || 0} رصيد`;
            
            loadStats();
            loadAccounts();
        }

        function doLogout() {
            localStorage.removeItem('btc_token');
            token = null;
            currentUser = null;
            location.reload();
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats', { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statTotal').textContent = data.stats.total_accounts || 0;
                    document.getElementById('statActive').textContent = data.stats.active_accounts || 0;
                    document.getElementById('statExpired').textContent = data.stats.expired_accounts || 0;
                    document.getElementById('statCredits').textContent = data.stats.available_credits || 0;
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function createAccount() {
            const username = document.getElementById('accUsername').value.trim();
            const password = document.getElementById('accPassword').value.trim();
            const plan_id = parseInt(document.getElementById('accType').value);
            const is_random = document.getElementById('isRandom').checked;
            const btn = document.getElementById('createBtn');

            btn.disabled = true;
            btn.textContent = 'جاري الإنشاء...';

            try {
                const res = await fetch('/api/account/create', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        username: username || null, 
                        password: password || null, 
                        plan_id, 
                        is_random 
                    })
                });

                const data = await res.json();
                btn.disabled = false;
                btn.textContent = 'إنشاء الحساب';

                if (data.success) {
                    lastCreated = data.data;
                    document.getElementById('resultUsername').textContent = data.data.username;
                    document.getElementById('resultPassword').textContent = data.data.password;
                    document.getElementById('resultPlan').textContent = data.data.plan;
                    document.getElementById('resultExpiry').textContent = new Date(data.data.expiry_date).toLocaleDateString('ar-EG');
                    document.getElementById('createResult').classList.remove('hidden');
                    loadStats();
                    loadAccounts();
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (error) {
                btn.disabled = false;
                btn.textContent = 'إنشاء الحساب';
                alert('خطأ في الاتصال');
            }
        }

        function copyCredentials() {
            if (lastCreated) {
                const text = `B.T.C VPN\nالمستخدم: ${lastCreated.username}\nكلمة المرور: ${lastCreated.password}\nالباقة: ${lastCreated.plan}\nالانتهاء: ${lastCreated.expiry_date}`;
                navigator.clipboard.writeText(text).then(() => alert('✅ تم النسخ'));
            }
        }

        async function loadAccounts() {
            try {
                const res = await fetch('/api/accounts', { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                const data = await res.json();
                const tbody = document.getElementById('accountsList');
                const noAccounts = document.getElementById('noAccounts');
                tbody.innerHTML = '';

                if (!data.accounts || data.accounts.length === 0) {
                    noAccounts.classList.remove('hidden');
                    return;
                }

                noAccounts.classList.add('hidden');
                data.accounts.forEach(acc => {
                    const isExpired = new Date(acc.expiry_date) < new Date();
                    const status = isExpired ? 'منتهي' : 'نشط';
                    const statusColor = isExpired ? 'text-red-400 bg-red-500/10' : 'text-green-400 bg-green-500/10';
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800/30">
                            <td class="p-4 font-mono text-yellow-400">${acc.username}</td>
                            <td class="p-4 text-blue-400">${acc.plan_name || 'غير محدد'}</td>
                            <td class="p-4 text-gray-300">${new Date(acc.expiry_date).toLocaleDateString('ar-EG')}</td>
                            <td class="p-4"><span class="px-3 py-1 rounded-full text-sm ${statusColor}">${status}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
            }
        }

        // Enter key
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (!document.getElementById('loginScreen').classList.contains('hidden')) {
                    doLogin();
                }
            }
        });
    </script>
</body>
</html>
